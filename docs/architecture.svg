<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Plumb architecture</title>
  <desc id="architecture-desc">The implemented command-line interface and planned desktop and agent interfaces use the shared Rust modeling core, which validates and serializes scenes as JSON.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-future" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#7a8399"/>
    </marker>
  </defs>

  <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
    <path d="M272 110H320Q328 110 328 118V146Q328 154 336 154H392"/>
    <path d="M656 200H736"/>
  </g>
  <g fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-future)">
    <path d="M272 190H344Q352 190 352 198V200H392"/>
    <path d="M272 270H360Q368 270 368 262V254Q368 246 376 246H392"/>
  </g>

  <g font-family="Arial, sans-serif">
    <g>
      <rect x="48" y="72" width="224" height="76" rx="8" fill="#ffffff" stroke="#2d3142"/>
      <text x="72" y="104" fill="#2d3142" font-size="16" font-weight="600">CLI</text>
      <text x="72" y="128" fill="#4f5d75" font-size="12">Implemented · create, edit, inspect</text>
    </g>
    <g>
      <rect x="48" y="160" width="224" height="60" rx="8" fill="#f5f5f5" stroke="#7a8399" stroke-dasharray="4 3"/>
      <text x="72" y="186" fill="#2d3142" font-size="16" font-weight="600">Desktop app</text>
      <text x="72" y="206" fill="#4f5d75" font-size="12">Planned · interactive viewport</text>
    </g>
    <g>
      <rect x="48" y="240" width="224" height="60" rx="8" fill="#f5f5f5" stroke="#7a8399" stroke-dasharray="4 3"/>
      <text x="72" y="266" fill="#2d3142" font-size="16" font-weight="600">Agent tools</text>
      <text x="72" y="286" fill="#4f5d75" font-size="12">Planned · structured operations</text>
    </g>

    <g>
      <rect x="392" y="132" width="264" height="136" rx="8" fill="#fceee8" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="416" y="174" fill="#2d3142" font-size="18" font-weight="600">plumb-core</text>
      <text x="416" y="200" fill="#4f5d75" font-size="13">Shared Rust modeling engine</text>
      <text x="416" y="224" fill="#4f5d75" font-size="12">Scene types</text>
      <text x="416" y="248" fill="#4f5d75" font-size="12">Validation · operations</text>
    </g>

    <g>
      <rect x="736" y="146" width="216" height="108" rx="8" fill="#ececec" stroke="#4f5d75"/>
      <text x="760" y="180" fill="#2d3142" font-size="16" font-weight="600">Scene file</text>
      <text x="760" y="206" fill="#4f5d75" font-size="13">Versioned JSON</text>
      <text x="760" y="230" fill="#4f5d75" font-size="12">Portable · inspectable</text>
    </g>

    <text x="48" y="340" fill="#7a8399" font-family="monospace" font-size="11" letter-spacing="1">INTERFACES</text>
    <text x="392" y="340" fill="#7a8399" font-family="monospace" font-size="11" letter-spacing="1">SHARED ENGINE</text>
    <text x="736" y="340" fill="#7a8399" font-family="monospace" font-size="11" letter-spacing="1">SCENE DATA</text>
  </g>
</svg>
