[package]
name = "plumb-desktop"
version = "0.1.0"
description = "Plumb desktop scene viewer"
authors = ["Plumb contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "plumb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
plumb-core = { path = "../../../crates/plumb-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
